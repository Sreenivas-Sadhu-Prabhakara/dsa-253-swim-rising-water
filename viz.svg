<svg xmlns="http://www.w3.org/2000/svg" width="760" height="613" viewBox="0 0 760 613" role="img" aria-label="Step-by-step visual walkthrough">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="context-stroke"/></marker></defs>
<rect x="1.0" y="1.0" width="758.0" height="611.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">Swim in Rising Water — minimize the deepest moment</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Water level = time; you can stand on cells ≤ t. Reach the corner minimizing the</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">MAXIMUM elevation along the path. Grid [[0,2],[1,3]]: the best path's worst cell is</text>
<text x="56.0" y="117.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">3.</text>
<rect x="24.0" y="131.0" width="44.0" height="30.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="46.0" y="151.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">0</text>
<rect x="70.0" y="131.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="92.0" y="151.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">2</text>
<rect x="24.0" y="163.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="183.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">1</text>
<rect x="70.0" y="163.0" width="44.0" height="30.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="92.0" y="183.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">3</text>
<line x1="24.0" y1="209.0" x2="736.0" y2="209.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="229.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="233.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="234.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Dijkstra with max() instead of +: a path's cost is its highest cell; the priority</text>
<text x="56.0" y="253.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">queue always expands the lowest-max frontier. Down to 1, right to 3 → max 3; or</text>
<text x="56.0" y="272.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">right 2 then down 3 → max 3.</text>
<text x="24.0" y="296.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="600">expansion</text>
<text x="47.0" y="312.0" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#64748b" text-anchor="middle">cell</text>
<text x="93.0" y="312.0" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#64748b" text-anchor="middle">path max</text>
<rect x="24.0" y="318.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="338.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">(0,0)</text>
<rect x="70.0" y="318.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="92.0" y="338.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">0</text>
<rect x="24.0" y="350.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="370.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">(1,0)</text>
<rect x="70.0" y="350.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="92.0" y="370.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">max(0,1) = 1</text>
<rect x="24.0" y="382.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="402.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">(0,1)</text>
<rect x="70.0" y="382.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="92.0" y="402.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">max(0,2) = 2</text>
<rect x="24.0" y="414.0" width="44.0" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="46.0" y="434.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">(1,1)</text>
<rect x="70.0" y="414.0" width="44.0" height="30.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="92.0" y="434.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">max(2,3) = 3</text>
<line x1="24.0" y1="460.0" x2="736.0" y2="460.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="480.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="484.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="485.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answer 3. Swapping + for max keeps Dijkstra's correctness (max is monotone too) —</text>
<text x="56.0" y="504.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">'minimax path' is a one-line edit to shortest-path. Binary-search-on-time + BFS</text>
<text x="56.0" y="523.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">reaches the same answer.</text>
<text x="72.0" y="558.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">answer</text>
